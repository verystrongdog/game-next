# Executable mirror of docs/workflow/issues.md v0.2.
name: Request for comments
description: Decide a consequential game, architecture, compatibility, production, or workflow question.
title: "[RFC] "
labels:
  - "type:rfc"
  - "status:triage"
body:
  - type: markdown
    attributes:
      value: |
        An RFC is always Strict. It authorizes analysis, discussion, and explicitly bounded prototypes, not production implementation until accepted.
  - type: textarea
    id: decision
    attributes:
      label: Decision to make
      description: State one consequential question and why a durable decision is necessary now.
    validations:
      required: true
  - type: textarea
    id: playable
    attributes:
      label: Current playable relationship or future constraint
      description: Link the current Slice, or explain the concrete future production constraint this decision protects.
    validations:
      required: true
  - type: textarea
    id: current_state
    attributes:
      label: Current state and constraints
      description: Describe accepted behavior, production boundaries, compatibility needs, evidence, assumptions, and unknowns separately.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Credible options
      description: Compare at least two real alternatives and doing nothing when meaningful. Give player/production benefits, costs, risks, and unknowns.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision and rationale
      description: State the recommendation and why it best fits current evidence and constraints. It remains a proposal until accepted.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and bounded prototypes
      description: Link code, tests, measurements, diagrams, grayboxes, builds, or playtests and state evidence still missing.
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences and affected boundaries
      description: Include removed options, ownership, save/data compatibility, content cost, pipeline impact, maintenance, and follow-up work.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Migration, rollback, and failure modes
      description: Explain how to adopt, reverse, contain, and regress-test the decision.
    validations:
      required: true
  - type: textarea
    id: close_condition
    attributes:
      label: Decision and close condition
      description: Name the owner, remaining evidence, and ADR/current-design fragment that will record acceptance.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Exclude at least one adjacent decision or production concern.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: RFC contract
      options:
        - label: I understand that opening or discussing this RFC does not approve production implementation.
          required: true
