# Executable mirror of docs/workflow/issues.md v0.2.
name: Bug report
description: Report behavior that contradicts an accepted expectation, with evidence sized to player impact.
title: "[Bug] "
labels:
  - "type:bug"
  - "status:triage"
body:
  - type: markdown
    attributes:
      value: |
        A submitted report is not authorization to implement. Blocker and data-loss reports may immediately stop distribution or preempt work while diagnosis continues.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed Issues for duplicates.
          required: true
        - label: The expected behavior is already established; otherwise I will use an Experiment or RFC.
          required: true
  - type: dropdown
    id: severity
    attributes:
      label: Player-impact severity
      description: Blocker/data loss map to Strict, Major to at least Standard, and contained Normal/Cosmetic reports may use Fast.
      options:
        - "Blocker — current playable cannot start or continue"
        - "Data loss — save, progress, settings, or authored content may be lost"
        - "Major — core experience is broken without a reasonable workaround"
        - "Normal — limited degradation or a workaround exists"
        - "Cosmetic — presentation or text only"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Exact build and observation context
      description: Give the build/commit, scene/save, platform, input, and other context relevant to reproducing this severity.
      placeholder: |
        Build/commit:
        Scene/save/seed:
        Platform and input:
        Relevant local changes/mods:
    validations:
      required: true
  - type: textarea
    id: actual_expected
    attributes:
      label: Actual versus expected behavior
      description: Separate what happened from the accepted expectation and link the authority for that expectation.
      placeholder: |
        Actual:
        Expected:
        Authority:
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and frequency
      description: Give the shortest path from the stated context to the failure and how often it occurs. A cosmetic report may use a direct locator and screenshot.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Playable impact and workaround
      description: State which player journey is blocked/degraded and whether the player or developer can continue safely.
    validations:
      required: true
  - type: textarea
    id: data_loss
    attributes:
      label: Data-loss containment and recovery
      description: Required for data loss. Name affected versions/data, backups, recovery options, distribution containment, and regression scope.
  - type: textarea
    id: regression
    attributes:
      label: Suspected regression range and verification scope
      description: If known, identify the last good build/change and what adjacent behavior must be retested.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach or link the smallest useful log, screenshot, video, replay, save, crash dump, or profiler capture and explain what matters.
