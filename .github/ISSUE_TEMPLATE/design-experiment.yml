# Executable mirror of docs/workflow/issues.md v0.2.
name: Design or technical experiment
description: Reduce an important game-design or production unknown through a bounded prototype or spike.
title: "[Experiment] "
labels:
  - "type:experiment"
  - "status:triage"
body:
  - type: markdown
    attributes:
      value: |
        An admitted Experiment authorizes only its prototype, iteration envelope, and evidence collection. It does not automatically approve production design or prototype code.
  - type: dropdown
    id: mode
    attributes:
      label: Experiment mode
      options:
        - "Exploratory — establish a first baseline or discover viable directions"
        - "Comparative — test a falsifiable hypothesis or compare alternatives"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Delivery-risk lane
      options:
        - "Standard"
        - "Strict — costly, cross-system, release-affecting, or hard to contain"
    validations:
      required: true
  - type: textarea
    id: playable
    attributes:
      label: Current playable relationship
      description: Link the current Slice/PLAYABLE revision. If this selects the first playable, state that bootstrap purpose explicitly.
    validations:
      required: true
  - type: textarea
    id: intent
    attributes:
      label: Experience intent or production problem
      description: State what the player should experience or what production uncertainty prevents progress. Separate intent from observed fact.
    validations:
      required: true
  - type: textarea
    id: evidence_unknowns
    attributes:
      label: Starting evidence, assumptions, and unknowns
      description: Link existing evidence when it exists. For a first exploratory pass, explicitly state that no baseline exists and what baseline will be created.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Single experiment question
      description: Write the smallest important unknown this work should reduce.
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Exploratory proposition or comparative hypothesis
      description: Exploratory work states promising directions to expose; comparative work states what observation would weaken or falsify the hypothesis.
    validations:
      required: true
  - type: textarea
    id: prototype
    attributes:
      label: Cheapest useful prototype or spike
      description: Choose paper, graybox, temporary code/content, measurement, or playtest. State what must not be productionized.
    validations:
      required: true
  - type: textarea
    id: envelope
    attributes:
      label: Iteration envelope
      description: List what may change, allowed ranges/variants, what must remain invariant, and the maximum time or iteration count.
      placeholder: |
        May change:
        Must not change:
        Time/iteration budget:
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Fixed playable or evaluation scenario
      description: Specify build, scene/setup, starting conditions, player profile, duration, and comparison variant where applicable.
    validations:
      required: true
  - type: textarea
    id: evidence_plan
    attributes:
      label: Evidence and interpretation plan
      description: Separate observed behavior, player statements, measurements, and owner judgment. Name the human creative/technical judge.
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop conditions and possible decisions
      description: State when to stop and how accept, revise, reject, or inconclusive outcomes will be distinguished.
    validations:
      required: true
  - type: textarea
    id: disposition
    attributes:
      label: Planned prototype disposition
      description: State the likely delete/isolate/reuse/rewrite options and what decision must be recorded at closure.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State what this Experiment will not answer or productionize.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Experiment contract
      options:
        - label: I understand that failure or an inconclusive result can be valid evidence.
          required: true
        - label: I will log envelope changes by build without rewriting the admitted body.
          required: true
        - label: Production adoption requires a current-design fragment and an admitted Implementation or Task.
          required: true
